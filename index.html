<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Snake drawn and animated with CSS, driven by a few lines of JavaScript." />
    <title>CSS Snake</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23596022'/><circle cx='11' cy='5' r='1.6' fill='%23f3ecdc'/></svg>" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game" data-state="ready" style="--speed: 140ms">
      <header class="hud">
        <h1>CSS Snake</h1>
        <div class="hud-right">
          <p class="score" data-score="0" data-best="0"></p>
          <div class="controls">
            <button class="pause-btn" type="button" aria-label="Play or pause" title="Play / pause">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" /></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
            </button>
            <button class="restart-btn" type="button" aria-label="Restart" title="Restart">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /><path d="M20 3.5v5.5h-5.5z" /></svg>
            </button>
            <button class="music-btn" type="button" aria-label="Music" aria-pressed="true" title="Music">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 17.5V6l10-2.5v11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                <circle cx="6.5" cy="17.5" r="2.8" />
                <circle cx="16.5" cy="15" r="2.8" />
                <path class="icon-mute" d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
            <input class="volume" type="range" min="0" max="100" step="5" value="50" aria-label="Music volume" title="Music volume" />
            <button class="sound-btn" type="button" aria-label="Sound" aria-pressed="true" title="Sound">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
                <path class="icon-waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path class="icon-mute" d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div class="board" role="img" aria-label="Snake board">
        <div class="food"></div>
        <button class="overlay" type="button" aria-label="Start or resume">
          <span class="scene" aria-hidden="true">
            <span class="m-shake">
              <span class="m-fur"></span>
              <svg class="snake-held" viewBox="0 0 60 136">
                <path class="s-body" d="M10 62 C 8 40, 14 26, 20 22 C 30 20, 40 20, 48 22" />
                <path class="s-belly" d="M10 62 C 8 40, 14 26, 20 22 C 30 20, 40 20, 48 22" />
                <rect class="s-rattle" x="4" y="60" width="12" height="22" rx="5" />
                <path class="s-rings" d="M3 66h14M3 71h14M3 76h14" />
                <g class="s-dangle">
                  <path class="s-body" d="M48 22 C 66 40, 36 66, 52 92 S 44 116, 48 122" />
                  <path class="s-belly" d="M48 22 C 66 40, 36 66, 52 92 S 44 116, 48 122" />
                  <ellipse class="s-head" cx="48" cy="130" rx="12" ry="10" />
                  <path class="s-eyes" d="M40 125l5 5M45 125l-5 5M51 125l5 5M56 125l-5 5" />
                </g>
              </svg>
              <span class="m-snout"><span class="m-fur"></span></span>
            </span>
          </span>
          <span class="dead-snake" aria-hidden="true">
            <span class="d-neck"></span>
            <span class="d-tongue"></span>
            <span class="d-head"></span>
          </span>
        </button>
      </div>

      <p class="status" aria-live="polite"></p>

      <nav class="pad" aria-label="Direction controls">
        <button type="button" data-dir="up" aria-label="Up"></button>
        <button type="button" data-dir="left" aria-label="Left"></button>
        <button type="button" data-dir="right" aria-label="Right"></button>
        <button type="button" data-dir="down" aria-label="Down"></button>
      </nav>

      <footer class="help">
        <span class="keys">Arrow keys or WASD to move · Space to pause · </span><a href="https://eli7pm.me/">eli7pm.me</a>
      </footer>
    </main>
    <svg class="defs" aria-hidden="true">
      <!-- Mongoose silhouette from SVG Repo (www.svgrepo.com), scaled to its bounding box for use as a CSS clip-path -->
      <clipPath id="mongoose-clip" clipPathUnits="objectBoundingBox">

      </clipPath>
    </svg>
    <script src="music.js"></script>
    <script src="snake.js"></script>
  </body>
</html>
